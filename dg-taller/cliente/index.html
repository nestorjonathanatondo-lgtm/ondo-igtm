<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DG Taller - Cliente</title><style>
body{font-family:system-ui;background:#f5ecec;display:grid;place-items:center;min-height:100vh;margin:0}
.card{background:#f5ecec;border-radius:24px;padding:32px;box-shadow:12px 12px 24px #d8c6c6,-12px -12px 24px #fff;width:100%;max-width:400px;text-align:center}
h1{color:#7b2d2d} input{width:100%;padding:16px;border:none;border-radius:14px;background:#f5ecec;box-shadow:inset 5px 5px 10px #d8c6c6,inset -5px -5px 10px #fff;margin:16px 0;text-align:center;font-size:20px;letter-spacing:3px;font-weight:800;outline:none}
button{width:100%;padding:14px;border:none;border-radius:12px;background:#7b2d2d;color:#fff;font-weight:800;cursor:pointer}
.badge{display:inline-block;background:#7b2d2d;color:#fff;padding:4px 12px;border-radius:999px;font-size:12px}
</style></head>
<body><div class="card">
<span class="badge">CLIENTE FIJA</span><h1>Consulta tu servicio</h1><p>Ingresa código: <b>ABC1234</b></p>
<input id="code" placeholder="ABC1234" maxlength="7"/><button onclick="ver()">Ver estado</button><div id="res" style="margin-top:16px;font-weight:600"></div>
<script>function ver(){const c=document.getElementById('code').value.trim().toUpperCase();const r=document.getElementById('res'); if(c==='ABC1234'){r.innerHTML='✅ Vehículo: FIAT Toro - Servicio: En proceso - Entrega estimada: Hoy 18:00';} else if(c===''){r.innerHTML='⚠️ Ingresa tu código';} else {r.innerHTML='❌ Código no encontrado';}}</script>
</div></body></html>
